name: CI/CD Monolith ke Minikube

on:
  push:
    branches: ["main", "master"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Tarik Kode Terbaru
      uses: actions/checkout@v4

    - name: Login ke Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Docker Image
      run: |
        docker build -t jepanya/deploy-monolith:${{ github.sha }} .
        docker push jepanya/deploy-monolith:${{ github.sha }}

    - name: Update Tag di k8s.yaml otomatis
      run: |
        git config --global user.name "Github Action Bot"
        git config --global user.email "actions@github.com"

        sed -i 's|image: jepanya/deploy-monolith:.*|image: jepanya/deploy-monolith:${{ github.sha }}|g' k8s.yaml
        
        git add k8s.yaml
        git commit -am "chore: update k8s image tag to ${{ github.sha }}"
        git push
