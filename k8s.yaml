apiVersion: v1
kind: Deployment
metadata:
  name: deploy-monolith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-monolith
  template:
    metadata:
      labels:
        app: deploy-monolith
    spec:
      containers:
      - name: deploy-monolith
        image: jepanya/deploy-monolith:6a90bfd50a1fcd751cc39f3b57f3ae823f0e651b
        imagePullPolicy: IfNotPresent
        ports:
        - containerPorts: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name:deploy-monolith
spec:
  type: NodePort
  selector:
    app: deploy-monolith
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30005
