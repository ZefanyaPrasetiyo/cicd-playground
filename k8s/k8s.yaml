apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-monolith
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploy-monolith
  template:
    metadata:
      labels:
        app: deploy-monolith
    spec:
      containers:
      - name: deploy-monolith
        image: jepanya/deploy-monolith:4f92c1ad58fcf433ddc6c249efe9c8337a698ebb
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: deploy-service
spec:
  type: NodePort
  selector:
    app: deploy-monolith
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30005
